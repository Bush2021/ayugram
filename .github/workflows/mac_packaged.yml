name: macOS packaged

on:
  workflow_dispatch:

jobs:

  macos:
    name: macOS
    runs-on: macos-26

    strategy:
      matrix:
        defines:
          - ""

    env:
      GIT: "https://github.com"
      CMAKE_GENERATOR: "Ninja"
      CMAKE_BUILD_TYPE: "Release"
      CMAKE_BUILD_PARALLEL_LEVEL: ""
      CMAKE_PREFIX_PATH: "/opt/homebrew/opt/ffmpeg@6:/opt/homebrew/opt/openal-soft"
      TDE2E: "51743dfd01dff6179e2d8f7095729caa4e2222e9"
      TLOTTIE: "92df98dc209bc39b1e567ec74a8c86a0af5239de"
      WALLET_ENGINE: "e59e0d89d7ee90c388bf36e3334c5b276f396697"
      RUST_PATCHES: "aec474953ff7ee9b6e4cd9b8658288ea86d124f3"
      RUST_TOOLCHAIN: "1.96.1"
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      MANUAL_CACHING: "1"
      AUTO_CACHING: "1"

    steps:
      - name: Get repository name.
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.REPO_NAME }}

      - name: First set up.
        run: |
          libs="ada-url ffmpeg@6 jpeg-xl libavif libheif minizip openal-soft openh264 openssl opus qtbase qtimageformats qtshadertools qtsvg xz"
          brew update
          brew upgrade || true
          brew install autoconf automake boost cmake libtool ninja pkg-config python $libs
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          sudo sed -i '' '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/ -g//' /opt/homebrew/share/cmake/Modules/Compiler/GNU.cmake

          xcodebuild -version > CACHE_KEY.txt
          brew list --versions $libs >> CACHE_KEY.txt
          echo $MANUAL_CACHING >> CACHE_KEY.txt
          echo "$GITHUB_WORKSPACE" >> CACHE_KEY.txt
          if [ "$AUTO_CACHING" = "1" ]; then
            thisFile=$REPO_NAME/.github/workflows/mac_packaged.yml
            echo `md5 -q $thisFile` >> CACHE_KEY.txt
          fi
          echo "CACHE_KEY=`md5 -q CACHE_KEY.txt`" >> $GITHUB_ENV

          echo "MACOSX_DEPLOYMENT_TARGET=$(grep 'set(QT_SUPPORTED_MIN_MACOS_VERSION' /opt/homebrew/Cellar/qtbase/*/lib/cmake/Qt6/Qt6ConfigExtras.cmake | sed -E 's/^.*"(.*)"\)$/\1/')" >> $GITHUB_ENV
          echo "LibrariesPath=`pwd`" >> $GITHUB_ENV

          echo "RNNOISE=`curl -sSL --header 'Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' https://api.github.com/repos/xiph/rnnoise/git/refs/heads/master | jq -r .object.sha`" >> $GITHUB_ENV
          echo "WEBRTC=`curl -sSL --header 'Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' https://api.github.com/repos/desktop-app/tg_owt/git/refs/heads/master | jq -r .object.sha`" >> $GITHUB_ENV

      - name: RNNoise cache.
        id: cache-rnnoise
        uses: actions/cache@v6
        with:
          path: ${{ env.LibrariesPath }}/local/rnnoise
          key: ${{ runner.OS }}-rnnoise-${{ env.RNNOISE }}-${{ env.CACHE_KEY }}

      - name: RNNoise.
        if: steps.cache-rnnoise.outputs.cache-hit != 'true'
        run: |
          cd $LibrariesPath

          git clone --depth=1 $GIT/xiph/rnnoise.git
          cd rnnoise
          ./autogen.sh
          ./configure --prefix=$LibrariesPath/local/rnnoise --disable-examples --disable-doc
          make -j$(sysctl -n hw.logicalcpu)
          make install

      - name: WebRTC cache.
        id: cache-webrtc
        uses: actions/cache@v6
        with:
          path: ${{ env.LibrariesPath }}/local/tg_owt
          key: ${{ runner.OS }}-webrtc-${{ env.WEBRTC }}-${{ env.CACHE_KEY }}

      - name: WebRTC.
        if: steps.cache-webrtc.outputs.cache-hit != 'true'
        run: |
          cd $LibrariesPath

          git clone --depth=1 --recursive --shallow-submodules $GIT/desktop-app/tg_owt.git
          cd tg_owt

          cmake -Bbuild . -DCMAKE_INSTALL_PREFIX=$LibrariesPath/local/tg_owt
          cmake --build build
          cmake --install build

      - name: TDE2E cache.
        id: cache-tde2e
        uses: actions/cache@v6
        with:
          path: ${{ env.LibrariesPath }}/local/tde2e
          key: ${{ runner.OS }}-tde2e-${{ env.TDE2E }}-${{ env.CACHE_KEY }}

      - name: TDE2E.
        if: steps.cache-tde2e.outputs.cache-hit != 'true'
        run: |
          cd $LibrariesPath

          git init tde2e
          cd tde2e
          git remote add origin $GIT/tdlib/td.git
          git fetch --depth=1 origin $TDE2E
          git reset --hard FETCH_HEAD

          cmake -Bbuild . -DCMAKE_INSTALL_PREFIX=$LibrariesPath/local/tde2e -DTD_E2E_ONLY=ON
          cmake --build build
          cmake --install build

      - name: Rust libraries cache.
        id: cache-tdesktop-rust
        uses: actions/cache@v6
        with:
          path: ${{ env.LibrariesPath }}/local/tdesktop_rust
          key: ${{ runner.OS }}-tdesktop-rust-${{ env.TLOTTIE }}-${{ env.WALLET_ENGINE }}-${{ env.RUST_PATCHES }}-${{ env.RUST_TOOLCHAIN }}-${{ env.CACHE_KEY }}

      - name: Rust libraries.
        if: steps.cache-tdesktop-rust.outputs.cache-hit != 'true'
        run: |
          cd $LibrariesPath

          rustup toolchain install $RUST_TOOLCHAIN --profile minimal
          export RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN
          export PATH="$(dirname "$(rustup which --toolchain $RUST_TOOLCHAIN cargo)"):$PATH"

          git init patches
          git -C patches remote add origin $GIT/desktop-app/patches.git
          git -C patches fetch --depth=1 origin $RUST_PATCHES
          git -C patches reset --hard FETCH_HEAD

          git init tlottie
          git -C tlottie remote add origin $GIT/dkaraush/tlottie.git
          git -C tlottie fetch --depth=1 origin $TLOTTIE
          git -C tlottie reset --hard FETCH_HEAD

          export GIT_LFS_SKIP_SMUDGE=1
          git init wallet-engine
          git -C wallet-engine remote add origin $GIT/i582/wallet-engine.git
          git -C wallet-engine fetch --depth=1 origin $WALLET_ENGINE
          git -C wallet-engine reset --hard FETCH_HEAD
          git -C wallet-engine apply ../patches/wallet-engine.patch

          cargo new --lib --vcs none tdesktop_rust
          cd tdesktop_rust
          printf 'pub use ::tlottie;\npub use ::wallet_engine;\n' > src/lib.rs
          cargo add --path ../tlottie --features c-api
          cargo add --path ../wallet-engine

          cargo rustc --lib --release \
          --crate-type staticlib --crate-type cdylib \
          --target aarch64-apple-darwin \
          --config "profile.release.opt-level='z'" \
          --config "profile.release.lto='thin'" \
          --config "profile.release.codegen-units=1" \
          --config "profile.release.panic='unwind'" \
          --config "profile.release.package.tlottie.opt-level=3" \
          -- --print native-static-libs

          prefix=$LibrariesPath/local/tdesktop_rust
          mkdir -p $prefix/lib $prefix/include/tlottie $prefix/include/wallet_engine
          cp target/aarch64-apple-darwin/release/libtdesktop_rust.a $prefix/lib/
          cp ../tlottie/include/tlottie.h $prefix/include/tlottie/
          cargo run --manifest-path ../wallet-engine/bindgen/cpp/bindgen/Cargo.toml --locked -- \
          --library --out-dir $prefix/include/wallet_engine \
          target/aarch64-apple-darwin/release/libtdesktop_rust.dylib

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          cd $REPO_NAME
          export CMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH$(find $LibrariesPath/local -mindepth 1 -maxdepth 1 -type d -exec printf ':%s' {} +)"

          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo Define from matrix: $DEFINE
            echo "ARTIFACT_NAME=AyuGram ${{ matrix.defines }}" >> $GITHUB_ENV
          else
            echo "ARTIFACT_NAME=AyuGram" >> $GITHUB_ENV
          fi

          cmake -Bbuild -GXcode . \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DTDESKTOP_API_ID=2040 \
          -DTDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 \
          -DDESKTOP_APP_DISABLE_AUTOUPDATE=ON \
          $DEFINE

          cd build
          # `xcodebuild` is used instead of `cmake --build` to make icons work properly.
          # https://github.com/Bush2021/ayugram/blob/7d16d749fdaf55867754e8d8ef585d04c9382092/Telegram/CMakeLists.txt#L1996
          xcodebuild -configuration Release -parallelizeTargets

          cd Release
          macdeployqt AyuGram.app
          codesign --remove-signature AyuGram.app

      - name: Move artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          cd $REPO_NAME/build/Release
          mkdir -p artifact
          mv AyuGram.app artifact/

      - uses: actions/upload-artifact@v7
        if: env.UPLOAD_ARTIFACT == 'true'
        name: Upload artifact.
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.REPO_NAME }}/build/Release/artifact/
